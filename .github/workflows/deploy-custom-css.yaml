name: Deploy custom CSS to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - assets/custom-css/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-custom-css.yaml
  workflow_dispatch:

concurrency:
  group: deploy-custom-css
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No build step: the files under assets/custom-css are deployed as-is.
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NORTIC_ASSETS }}
          channelId: live
          projectId: nortic-assets
