<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dagny playground</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header class="bar">
      <strong class="brand">dagny playground</strong>
      <label
        >Miljö
        <select id="env">
          <option value="prod">prod</option>
          <option value="staging">staging</option>
        </select>
      </label>
      <label
        >Arrangör
        <select id="org"></select>
      </label>
      <label
        >Event
        <select id="event"></select>
      </label>
      <label class="narrow"
        >Annat event-id
        <input id="event-id" inputmode="numeric" placeholder="t.ex. 87118" />
      </label>
      <label
        >Sida
        <select id="page"></select>
      </label>
      <span class="widths" id="widths"></span>
      <label class="narrow"
        >Bredd
        <input id="width" inputmode="numeric" />
      </label>
      <label class="check"><input type="checkbox" id="theme" checked /> CSS</label>
      <label class="check"><input type="checkbox" id="js" checked /> JS</label>
      <label class="check"><input type="checkbox" id="compare" /> Jämför med dagny</label>
      <a id="open" target="_blank" rel="noopener">Öppna sidan</a>
    </header>
    <nav class="actions" id="actions" aria-label="Lägen på sidan"></nav>
    <main class="stage" id="stage"></main>
    <p class="status" id="status" role="status"></p>
    <script src="shell.js"></script>
  </body>
</html>
